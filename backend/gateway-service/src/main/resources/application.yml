spring:
  application:
    name: gateway-service

  config:
    import: optional:file:../../.env[.properties],optional:file:.env[.properties]

  # ===== Routing table: "if the path matches X, forward the request to service Y" =====
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8082} # Docker: http://auth-service:8082
              predicates:
                - Path=/api/auth/**

            - id: coupon-service
              uri: ${COUPON_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/coupons, /api/coupons/**

            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/users/**

server:
  port: 8080 # the ONE port the frontend talks to
  compression:
    enabled: true # gzip JSON responses bigger than 2 KB before sending them to the browser

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200} # the Angular dev server (Phase 6)

logging:
  level:
    com.deals: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health
