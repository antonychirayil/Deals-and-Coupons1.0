spring:
  application:
    name: user-service

  config:
    import: optional:file:../../.env[.properties],optional:file:.env[.properties]

  mongodb:
    # ${MONGO_HOST:localhost} = use the MONGO_HOST environment variable, or "localhost" if it isn't set.
    # Docker sets MONGO_HOST=mongodb (the container's name); from VS Code it stays localhost.
    uri: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@${MONGO_HOST:localhost}:27017/deals_db?authSource=admin

  data:
    mongodb:
      auto-index-creation: true # unique index: a user can save a coupon only once

server:
  port: 8083

app:
  jwt:
    secret: ${JWT_SECRET} # the SAME secret as auth-service, so we can check its tokens
  coupon-service:
    url: ${COUPON_SERVICE_URL:http://localhost:8081} # where to ask for coupon details (Docker: http://coupon-service:8081)

logging:
  level:
    com.deals: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
