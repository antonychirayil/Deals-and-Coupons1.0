<article class="card" [class.expired]="coupon().expired">
  <div class="top">
    <span class="provider">{{ coupon().provider }}</span>
    <span class="discount">{{ coupon().discount }}% OFF</span>
  </div>

  <p class="description">{{ coupon().description ?? 'Exclusive discount' }}</p>

  <div class="meta">
    <span class="category">{{ coupon().category }}</span>
    <!-- "date" is a pipe: it formats a value for display -->
    <span>Valid till {{ coupon().expiryDate | date: 'mediumDate' }}</span>
  </div>

  <div class="actions">
    @if (coupon().expired) {
      <p class="expired-label">This coupon has expired</p>
    } @else if (codeVisible()) {
      <div class="code">{{ coupon().code }}</div>
    } @else {
      <button class="btn btn-outline show-code" type="button" (click)="showCode()">Show code</button>
    }

    <button
      type="button"
      class="save"
      [class.saved]="saved()"
      [attr.aria-label]="saved() ? 'Remove from saved coupons' : 'Save coupon'"
      [title]="saved() ? 'Remove from saved' : 'Save for later'"
      (click)="toggleSave()"
    >
      {{ saved() ? '★' : '☆' }}
    </button>
  </div>
</article>
