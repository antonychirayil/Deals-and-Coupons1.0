server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Compress text files before sending them
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Every /api/... request is passed on to the gateway container.
  # The browser only ever talks to this one address, so no CORS is needed.
  location /api/ {
    proxy_pass http://gateway-service:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Angular pages like /coupons or /admin are not real files on disk:
  # send index.html and let Angular's router show the right page.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
